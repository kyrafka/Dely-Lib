spring.config.import=optional:file:./application-local.properties
spring.application.name=mobil
server.port=${SERVER_PORT:9090}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.threads.max=${SERVER_THREADS_MAX:100}
server.tomcat.accept-count=${SERVER_ACCEPT_COUNT:100}
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:12MB}

app.checkout.enabled=${APP_CHECKOUT_ENABLED:false}

app.sessions.cleanup-cron=${SESSION_CLEANUP_CRON:0 15 * * * *}
